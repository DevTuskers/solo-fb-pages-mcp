[project]
name = "solo-fb-pages-mcp"
version = "0.1.0"
description = "Self-hosted MCP server for managing your own Facebook Pages (posts, comments, moderation, insights)"
readme = "README.md"
authors = [
    { name = "Devin AI", email = "158243242+devin-ai-integration[bot]@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "mcp[cli]>=1.27,<2",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
solo-fb-pages-mcp = "solo_fb_pages_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101", "S105", "S106", "S104", "RUF001", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
packages = ["solo_fb_pages_mcp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
